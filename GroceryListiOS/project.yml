name: GroceryList
options:
  bundleIdPrefix: com.grocerylist
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  SWIFT_VERSION: "5.9"
targets:
  GroceryList:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GroceryList
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.grocerylist.app
      INFOPLIST_KEY_CFBundleDisplayName: Grocery List
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconSageBag AppIconNavyCart AppIconProduce AppIconCream AppIconDark
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_EMIT_LOC_STRINGS: YES
